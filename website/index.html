<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        h1 {
            margin-bottom: 8px;
            color: #0c93e7;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 24px;
        }
        .info {
            text-align: left;
            margin: 16px 0;
            line-height: 1.8;
        }
        .info span {
            font-weight: bold;
            color: #2c3e50;
        }
        .tag {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.9em;
            margin: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>你好，我是晏奥瑜 👋</h1>
        <p class="subtitle">微电子科学与工程 · 数字IC方向</p>
        <div class="info">
            <p><span>兴趣：</span>RISC-V、数字芯片设计、开源硬件</p>
            <p><span>联系方式：</span>399608262@qq.com</p>
            <p><span>GitHub：</span><a href="https://github.com/yanaoyu">yanaoyu</a></p>
        </div>
        <div>
            <span class="tag">Verilog</span>
            <span class="tag">Python</span>
            <span class="tag">Git</span>
        </div>
    </div>
</body>
</html>
