<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇 · 阶段一</title>
<style>
  body { display:flex; flex-direction:column; align-items:center; background:#1a1a2e; color:#eee; font-family:Segoe UI,sans-serif; margin:0; padding:20px; }
  h1 { margin:10px; color:#0c93e7; }
  #status { margin:8px; font-size:18px; }
  canvas { background:#16213e; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.4); }
  #tip { color:#888; margin-top:10px; }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div id="status">得分：0 ｜ 最高分：0</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="tip">方向键控制 ｜ 空格暂停</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const box = 20;
let snake, dir, food, score, highScore, paused, gameOver;

function init() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  score = 0;
  highScore = Number(localStorage.getItem('snakeHigh') || 0);
  paused = false;
  gameOver = false;
  placeFood();
  updateStatus();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function updateStatus() {
  document.getElementById('status').textContent = `得分：${score} ｜ 最高分：${highScore}`;
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  ctx.fillStyle = '#e94560';
  ctx.fillRect(food.x*box, food.y*box, box-2, box-2);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#0c93e7' : '#4ea8de';
    ctx.fillRect(s.x*box, s.y*box, box-2, box-2);
  });
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', 200, 190);
    ctx.font = '18px sans-serif';
    ctx.fillText('按 R 重新开始', 200, 230);
  }
  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停', 200, 210);
  }
}

function step() {
  if (paused || gameOver) return;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
    gameOver = true;
    if (score > highScore) { highScore = score; localStorage.setItem('snakeHigh', highScore); }
    updateStatus();
    return;
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    if (score > highScore) { highScore = score; localStorage.setItem('snakeHigh', highScore); }
    updateStatus();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    if (score > highScore) { highScore = score; localStorage.setItem('snakeHigh', highScore); }
    updateStatus();
    placeFood();
  } else {
    snake.pop();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && dir.y === 0) dir = {x: 0, y: -1};
  if (e.key === 'ArrowDown' && dir.y === 0) dir = {x: 0, y: 1};
  if (e.key === 'ArrowLeft' && dir.x === 0) dir = {x: -1, y: 0};
  if (e.key === 'ArrowRight' && dir.x === 0) dir = {x: 1, y: 0};
  if (e.key === ' ') paused = !paused;
  if (e.key === 'r' || e.key === 'R') init();
});

init();
setInterval(() => { step(); draw(); }, 150);
</script>
</body>
</html>
