<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>贪吃蛇 · 阶段二 AI 自动演示</title>
  <style>
    body[data-theme="dark"] {
      --bg: #1a1a2e;
      --panel: #16213e;
      --text: #eee;
      --accent: #0c93e7;
      --muted: #888;
      --btn-bg: #0f3460;
      --btn-text: #e8f4ff;
      --border: #2a3a5e;
      --modal-bg: #16213e;
      --row-alt: #1b294a;
    }

    body[data-theme="light"] {
      --bg: #eef1f6;
      --panel: #ffffff;
      --text: #1f2430;
      --accent: #0a7fd1;
      --muted: #6b7280;
      --btn-bg: #e3eefc;
      --btn-text: #0a3d78;
      --border: #cfd8e6;
      --modal-bg: #ffffff;
      --row-alt: #f3f6fb;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Segoe UI, sans-serif;
      margin: 0;
      padding: 20px;
      transition: background 0.2s, color 0.2s;
    }

    h1 {
      margin: 10px;
      color: var(--accent);
    }

    #status {
      margin: 8px;
      font-size: 18px;
    }

    .toolbar {
      margin: 10px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .toolbar button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 4px;
      font-size: 14px;
      cursor: pointer;
      transition: filter 0.15s, transform 0.05s;
    }

    .toolbar button:hover {
      filter: brightness(1.15);
    }

    .toolbar button:active {
      transform: translateY(1px);
    }

    canvas {
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    #tip {
      color: var(--muted);
      margin-top: 10px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal.hidden {
      display: none;
    }

    .modal-box {
      background: var(--modal-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 26px;
      min-width: 340px;
      max-width: 90vw;
      max-height: 70vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-box h2 {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 20px;
    }

    .record-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .record-row:nth-child(odd) {
      background: var(--row-alt);
    }

    .record-row .win {
      color: #22c55e;
      font-weight: bold;
    }

    .record-row .lose {
      color: #e94560;
      font-weight: bold;
    }

    .record-row .meta {
      color: var(--muted);
      font-size: 12px;
    }

    #emptyHistory {
      color: var(--muted);
      padding: 10px;
    }

    #closeHistory {
      margin-top: 16px;
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    #gameArea {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #speedPanel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      padding: 14px 16px;
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #speedLabel {
      color: var(--muted);
      font-size: 12px;
    }

    #speedValue {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent);
    }

    #speedInput {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      font-size: 14px;
      text-align: center;
    }

    #speedApplyBtn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body data-theme="dark">
  <h1>贪吃蛇 · AI 自动演示</h1>
  <div id="status">得分：0 ｜ 最高分：0 ｜ 局数：0 ｜ 已吃：0/15</div>
  <div class="toolbar">
    <button id="restartBtn" type="button">重开一局</button>
    <button id="themeBtn" type="button">切换浅色</button>
    <button id="modeBtn" type="button">切换无尽</button>
    <button id="aiToggleBtn" type="button">切换手动</button>
    <button id="historyBtn" type="button">查看战绩</button>
    <button id="resetBtn" type="button">重置</button>
  </div>
  <div id="gameArea">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="speedPanel">
      <div id="speedLabel">当前倍速</div>
      <div id="speedValue">×1</div>
      <input id="speedInput" type="number" min="0.02" step="1" value="1">
      <button id="speedApplyBtn" type="button">应用</button>
    </div>
  </div>
  <div id="tip">AI 自动运行 ｜ 中键或按钮 切手动/自动 ｜ 空格暂停 ｜ R 重开 ｜ 按住左键加速 右键按住=超级加速</div>
  <div id="historyModal" class="modal hidden">
    <div class="modal-box">
      <h2>最近 10 局战绩</h2>
      <div id="historyList"></div>
      <button id="closeHistory" type="button">关闭</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const box = 20;
    const GRID = 20;
    let snake, dir, food, score, highScore, paused, gameOver, aiMode, eaten;
    let fastMode = false;
    let spfastMode = false;
    let gameTimer;
    let userSpeed = 80;
    let lastMouseDownTime = 0;
    let pendingDirs = [];
    let taskMode = (localStorage.getItem('snakeTaskMode') || 'task') === 'task';
    let roundEnded = false;
    let gamesPlayed = 0;
    let history = [];
    const THEMES = {
      dark: { food: '#e94560', head: '#0c93e7', body: '#4ea8de', overlay: 'rgba(0,0,0,0.65)', text: '#ffffff', success: '#27e85f' },
      light: { food: '#d63352', head: '#0a82d4', body: '#79b8e6', overlay: 'rgba(0,0,0,0.55)', text: '#ffffff', success: '#2ecc40' }
    };
    let theme = localStorage.getItem('snakeTheme') || 'dark';
    let colors = THEMES[theme] || THEMES.dark;

    function applyTheme(t) {
      theme = t;
      colors = THEMES[t] || THEMES.dark;
      document.body.dataset.theme = t;
      localStorage.setItem('snakeTheme', t);
      document.getElementById('themeBtn').textContent = t === 'dark' ? '切换浅色' : '切换深色';
    }

    function loadStats() {
      highScore = Number(localStorage.getItem('snakeHigh') || 0);
      gamesPlayed = Number(localStorage.getItem('snakeGames') || 0);
      try {
        history = JSON.parse(localStorage.getItem('snakeHistory') || '[]');
        if (!Array.isArray(history)) history = [];
      } catch (e) {
        history = [];
      }
    }

    function saveStats() {
      localStorage.setItem('snakeHigh', highScore);
      localStorage.setItem('snakeGames', gamesPlayed);
      localStorage.setItem('snakeHistory', JSON.stringify(history));
    }

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      score = 0;
      paused = false;
      gameOver = false;
      roundEnded = false;
      aiMode = true;
      document.getElementById('aiToggleBtn').textContent = '切换手动';
      eaten = 0;
      pendingDirs = [];
      placeFood();
      updateStatus();
    }

    function endRound(success) {
      if (roundEnded) return;
      roundEnded = true;
      if (!success) gameOver = true;
      if (score > highScore) highScore = score;
      gamesPlayed++;
      history.push({
        no: gamesPlayed,
        success: success,
        score: score,
        time: new Date().toLocaleString()
      });
      if (history.length > 10) history.shift();
      saveStats();
      updateStatus();
    }

    function resetAll() {
      if (!confirm('确定清空最高分、局数和最近 10 局战绩吗？')) return;
      highScore = 0;
      gamesPlayed = 0;
      history = [];
      saveStats();
      init();
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function updateStatus() {
      document.getElementById('status').textContent =
        `得分：${score} ｜ 最高分：${highScore} ｜ 局数：${gamesPlayed} ｜ 已吃：${eaten}${taskMode ? '/15' : '（无尽）'}`;
    }

    function draw() {
      ctx.clearRect(0, 0, 400, 400);
      ctx.fillStyle = colors.food;
      ctx.fillRect(food.x * box, food.y * box, box - 2, box - 2);
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? colors.head : colors.body;
        ctx.fillRect(s.x * box, s.y * box, box - 2, box - 2);
      });
      if (gameOver) {
        ctx.fillStyle = colors.overlay;
        ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = colors.text;
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束', 200, 190);
        ctx.font = '18px sans-serif';
        ctx.fillText('按 R 重新开始', 200, 230);
      }
      if (paused && !roundEnded) {
        ctx.fillStyle = colors.overlay;
        ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = colors.text;
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('已暂停', 200, 210);
      }
      if (taskMode && eaten >= 15 && !gameOver) {
        ctx.fillStyle = colors.overlay;
        ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = colors.success;
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('已连续吃 15 个！', 200, 190);
        ctx.font = '18px sans-serif';
        ctx.fillStyle = colors.text;
        ctx.fillText('按 R 重新开始', 200, 230);
      }
    }

    function getNeighbors(pos, obstacles) {
      const dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
      return dirs.map(d => ({ x: pos.x + d.x, y: pos.y + d.y }))
        .filter(p =>
          p.x >= 0 && p.x < GRID && p.y >= 0 && p.y < GRID
          && !obstacles.some(o => o.x === p.x && o.y === p.y)
        );
    }

    function bfsPath(start, target, obstacles) {
      const queue = [start];
      const visited = new Set([`${start.x},${start.y}`]);
      const parent = new Map();
      while (queue.length) {
        const cur = queue.shift();
        if (cur.x === target.x && cur.y === target.y) {
          const path = [];
          let node = cur;
          while (node) {
            path.unshift(node);
            node = parent.get(`${node.x},${node.y}`);
          }
          return path;
        }
        for (const nb of getNeighbors(cur, obstacles)) {
          const key = `${nb.x},${nb.y}`;
          if (!visited.has(key)) {
            visited.add(key);
            parent.set(key, cur);
            queue.push(nb);
          }
        }
      }
      return null;
    }

    function getReachableSpace(start, obstacles) {
      const queue = [start];
      const visited = new Set([`${start.x},${start.y}`]);
      while (queue.length) {
        const cur = queue.shift();
        for (const nb of getNeighbors(cur, obstacles)) {
          const key = `${nb.x},${nb.y}`;
          if (!visited.has(key)) {
            visited.add(key);
            queue.push(nb);
          }
        }
      }
      return visited.size;
    }

    function evaluateMove(d) {
      const head = snake[0];
      const next = { x: head.x + d.x, y: head.y + d.y };
      if (next.x < 0 || next.x >= GRID || next.y < 0 || next.y >= GRID) return null;
      const eats = (next.x === food.x && next.y === food.y);
      const bodyToCheck = eats ? snake : snake.slice(0, -1);
      if (bodyToCheck.some(s => s.x === next.x && s.y === next.y)) return null;
      const newSnake = eats ? [next, ...snake] : [next, ...snake.slice(0, -1)];
      const newHead = newSnake[0];
      const newTail = newSnake[newSnake.length - 1];
      const bodyObstacles = newSnake.slice(1, -1);
      const canReachTail = bfsPath(newHead, newTail, bodyObstacles) !== null;
      const space = getReachableSpace(newHead, newSnake.slice(1));
      const distToFood = Math.abs(next.x - food.x) + Math.abs(next.y - food.y);
      return { d, next, eats, canReachTail, space, distToFood };
    }

    function isFoodPathSafe(path) {
      let sim = snake.map(s => ({ x: s.x, y: s.y }));
      for (let i = 1; i < path.length; i++) {
        const cell = path[i];
        const eats = (cell.x === food.x && cell.y === food.y);
        sim = [cell, ...sim];
        if (!eats) sim.pop();
      }
      const h = sim[0], t = sim[sim.length - 1];
      return bfsPath(h, t, sim.slice(1, -1)) !== null;
    }

    function aiMove() {
      const head = snake[0];
      const tail = snake[snake.length - 1];
      const bodyWithoutTail = snake.slice(0, -1);
      const dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
      const moves = dirs.map(d => evaluateMove(d)).filter(m => m !== null);
      if (moves.length === 0) return { x: 0, y: 0 };
      const foodPath = bfsPath(head, food, bodyWithoutTail);
      if (foodPath && foodPath.length > 1 && isFoodPathSafe(foodPath)) {
        const next = foodPath[1];
        const mv = moves.find(m => m.next.x === next.x && m.next.y === next.y);
        if (mv) return mv.d;
      }
      const tailPath = bfsPath(head, tail, bodyWithoutTail);
      if (tailPath && tailPath.length > 1) {
        const next = tailPath[1];
        const mv = moves.find(m => m.next.x === next.x && m.next.y === next.y);
        if (mv && mv.canReachTail) return mv.d;
      }
      const safeMoves = moves.filter(m => m.canReachTail);
      if (safeMoves.length > 0) {
        safeMoves.sort((a, b) => b.space - a.space);
        return safeMoves[0].d;
      }
      moves.sort((a, b) => b.space - a.space);
      return moves[0].d;
    }

    function step() {
      if (paused || roundEnded) return;
      while (pendingDirs.length > 0) {
        const nd = pendingDirs.shift();
        const isOpposite = (nd.x === -dir.x && nd.y === -dir.y);
        const isSame = (nd.x === dir.x && nd.y === dir.y);
        if (!isOpposite && !isSame) { dir = nd; break; }
      }
      if (aiMode) {
        const d = aiMove();
        if (d.x !== 0 || d.y !== 0) dir = d;
      }
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endRound(false);
        return;
      }
      const eatsNow = (head.x === food.x && head.y === food.y);
      const bodyToCheck = eatsNow ? snake : snake.slice(0, -1);
      if (bodyToCheck.some(s => s.x === head.x && s.y === head.y)) {
        endRound(false);
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        eaten++;
        if (score > highScore) { highScore = score; localStorage.setItem('snakeHigh', highScore); }
        updateStatus();
        placeFood();
        if (taskMode && eaten >= 15) endRound(true);
      } else {
        snake.pop();
      }
    }

    function renderHistory() {
      const boxEl = document.getElementById('historyList');
      if (history.length === 0) {
        boxEl.innerHTML = '<div id="emptyHistory">暂无战绩，快去玩一局吧。</div>';
        return;
      }
      boxEl.innerHTML = history.slice().reverse().map(r => {
        const result = r.success
          ? '<span class="win">成功（15/15）</span>'
          : '<span class="lose">失败</span>';
        return `<div class="record-row">
          <span>第 ${r.no} 局 ${result}</span>
          <span>得分 ${r.score}</span>
          <span class="meta">${r.time}</span>
        </div>`;
      }).join('');
    }
    const historyModal = document.getElementById('historyModal');
    document.addEventListener('keydown', e => {
      if (e.key === 'l' || e.key === 'L') {
        fastMode = true;
        startLoop();
      }
      if (e.key === ' ' && !roundEnded) {
        paused = !paused;
        e.preventDefault();
      }
      if (e.key === 'r' || e.key === 'R') init();
      if (!aiMode) {
        const nd =
          (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') ? { x: 0, y: -1 } :
            (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') ? { x: 0, y: 1 } :
              (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') ? { x: -1, y: 0 } :
                (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ? { x: 1, y: 0 } : null;
        if (nd && pendingDirs.length < 2) pendingDirs.push(nd);
      }
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'l' || e.key === 'L') {
        fastMode = false;
        startLoop();
      }
    })
    document.addEventListener('mousedown', e => {
      if (e.button === 0) {
        const now = Date.now();
        if (now - lastMouseDownTime < 300) spfastMode = true;
        lastMouseDownTime = now;
        fastMode = true;
        startLoop();
      }
      if (e.button === 2) {
        spfastMode = true;
        startLoop();
      }
      if (e.button === 1) { e.preventDefault(); toggleAiMode(); }
    });
    document.addEventListener('mouseup', e => {
      if (e.button === 0) {
        fastMode = false;
        spfastMode = false;
        startLoop();
      }
      if (e.button === 2) {
        spfastMode = false;
        startLoop();
      }
    });
    document.addEventListener('contextmenu', e => {
      e.preventDefault();
    });
    document.getElementById('restartBtn').addEventListener('click', init);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('themeBtn').addEventListener('click', () => {
      applyTheme(theme === 'dark' ? 'light' : 'dark');
    });
    document.getElementById('modeBtn').addEventListener('click', toggleGameMode);
    document.getElementById('aiToggleBtn').addEventListener('click', toggleAiMode);
    document.getElementById('historyBtn').addEventListener('click', () => {
      renderHistory();
      historyModal.classList.remove('hidden');
    });
    document.getElementById('closeHistory').addEventListener('click', () => {
      historyModal.classList.add('hidden');
    });
    historyModal.addEventListener('click', e => {
      if (e.target === historyModal) historyModal.classList.add('hidden');
    });

    function startLoop() {
      clearInterval(gameTimer);
      let speed;
      if (spfastMode) {
        speed = 1;
      } else if (fastMode) {
        speed = 40;
      } else {
        speed = userSpeed;
      }
      updateSpeedDisplay(speed);
      gameTimer = setInterval(() => { step(); draw(); }, speed);
    }

    function formatMult(m) {
      return Number.isInteger(m) ? String(m) : String(Math.round(m * 100) / 100);
    }

    function updateSpeedDisplay(speed) {
      document.getElementById('speedValue').textContent = '×' + formatMult(80 / speed);
    }

    function applyInputSpeed() {
      const input = document.getElementById('speedInput');
      const mult = parseFloat(input.value);
      if (!isFinite(mult) || mult <= 0) {
        input.value = formatMult(80 / userSpeed);
        return;
      }
      userSpeed = Math.max(1, 80 / mult);
      startLoop();
      input.value = formatMult(80 / userSpeed);
    }

    document.getElementById('speedApplyBtn').addEventListener('click', applyInputSpeed);
    document.getElementById('speedInput').addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') applyInputSpeed();
    });

    function toggleAiMode() {
      aiMode = !aiMode;
      document.getElementById('aiToggleBtn').textContent = aiMode ? '切换手动' : '切换自动';
    }

    function toggleGameMode() {
      taskMode = !taskMode;
      localStorage.setItem('snakeTaskMode', taskMode ? 'task' : 'endless');
      document.getElementById('modeBtn').textContent = taskMode ? '切换无尽' : '切换任务';
      updateStatus();
      if (taskMode && eaten >= 15) endRound(true);
    }
    loadStats();
    applyTheme(theme);
    document.getElementById('modeBtn').textContent = taskMode ? '切换无尽' : '切换任务';
    init();
    startLoop();
  </script>
</body>

</html>
