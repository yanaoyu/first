<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇 · 阶段二 AI 自动演示</title>
<style>
  body { display:flex; flex-direction:column; align-items:center; background:#1a1a2e; color:#eee; font-family:Segoe UI,sans-serif; margin:0; padding:20px; }
  h1 { margin:10px; color:#0c93e7; }
  #status { margin:8px; font-size:18px; }
  canvas { background:#16213e; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.4); }
  #tip { color:#888; margin-top:10px; }
</style>
</head>
<body>
<h1>贪吃蛇 · AI 自动演示</h1>
<div id="status">得分：0 ｜ 最高分：0 ｜ 已吃：0/15</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="tip">AI 自动运行 ｜ 按 A 切换手动/自动 ｜ 空格暂停 ｜ R 重开</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const box = 20;
const GRID = 20;
let snake, dir, food, score, highScore, paused, gameOver, aiMode, eaten;

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  score = 0;
  highScore = Number(localStorage.getItem('snakeHigh') || 0);
  paused = false;
  gameOver = false;
  aiMode = true;
  eaten = 0;
  placeFood();
  updateStatus();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function updateStatus() {
  document.getElementById('status').textContent = `得分：${score} ｜ 最高分：${highScore} ｜ 已吃：${eaten}/15`;
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  ctx.fillStyle = '#e94560';
  ctx.fillRect(food.x*box, food.y*box, box-2, box-2);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#0c93e7' : '#4ea8de';
    ctx.fillRect(s.x*box, s.y*box, box-2, box-2);
  });
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', 200, 190);
    ctx.font = '18px sans-serif';
    ctx.fillText('按 R 重新开始', 200, 230);
  }
  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停', 200, 210);
  }
  if (eaten >= 15 && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#0f0';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('AI 已连续吃 15 个！', 200, 190);
    ctx.font = '18px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('按 R 重新开始', 200, 230);
  }
}

function getNeighbors(pos, obstacles) {
  const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
  return dirs.map(d => ({x:pos.x+d.x, y:pos.y+d.y}))
    .filter(p => p.x>=0 && p.x<GRID && p.y>=0 && p.y<GRID && !obstacles.some(o=>o.x===p.x && o.y===p.y));
}

function bfsPath(start, target, obstacles) {
  const queue = [start];
  const visited = new Set([`${start.x},${start.y}`]);
  const parent = new Map();
  while(queue.length) {
    const cur = queue.shift();
    if (cur.x === target.x && cur.y === target.y) {
      const path = [];
      let node = cur;
      while(node) {
        path.unshift(node);
        node = parent.get(`${node.x},${node.y}`);
      }
      return path;
    }
    for (const nb of getNeighbors(cur, obstacles)) {
      const key = `${nb.x},${nb.y}`;
      if (!visited.has(key)) {
        visited.add(key);
        parent.set(key, cur);
        queue.push(nb);
      }
    }
  }
  return null;
}

function getReachableSpace(start, obstacles) {
  const queue = [start];
  const visited = new Set([`${start.x},${start.y}`]);
  while(queue.length) {
    const cur = queue.shift();
    for (const nb of getNeighbors(cur, obstacles)) {
      const key = `${nb.x},${nb.y}`;
      if (!visited.has(key)) {
        visited.add(key);
        queue.push(nb);
      }
    }
  }
  return visited.size;
}

function isSafeMove(next) {
  const newSnake = [next, ...snake];
  if (next.x === food.x && next.y === food.y) {
    // 吃食物，尾巴不动
  } else {
    newSnake.pop();
  }
  const head = newSnake[0];
  const tail = newSnake[newSnake.length-1];
  const obstacles = newSnake.slice(0, -1);
  const path = bfsPath(head, tail, obstacles);
  if (!path) return false;
  const space = getReachableSpace(head, obstacles);
  return space >= newSnake.length;
}

function aiMove() {
  const head = snake[0];
  const bodyWithoutTail = snake.slice(0, -1);
  const path = bfsPath(head, food, bodyWithoutTail);
  if (path && path.length > 1) {
    const next = path[1];
    if (isSafeMove(next)) {
      return { x: next.x - head.x, y: next.y - head.y };
    }
  }
  const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
  let bestDir = null;
  let bestSpace = -1;
  for (const d of dirs) {
    const next = {x: head.x + d.x, y: head.y + d.y};
    if (next.x<0||next.x>=GRID||next.y<0||next.y>=GRID) continue;
    if (snake.some(s=>s.x===next.x && s.y===next.y)) continue;
    const newSnake = [next, ...snake];
    if (next.x === food.x && next.y === food.y) {
      // 吃食物，尾巴不动
    } else {
      newSnake.pop();
    }
    const obstacles = newSnake.slice(0, -1);
    const space = getReachableSpace(newSnake[0], obstacles);
    if (space > bestSpace) {
      bestSpace = space;
      bestDir = d;
    }
  }
  return bestDir || {x:0,y:0};
}

function step() {
  if (paused || gameOver || eaten >= 15) return;
  if (aiMode) {
    const d = aiMove();
    if (d.x !== 0 || d.y !== 0) dir = d;
  }
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
    gameOver = true;
    if (score > highScore) { highScore = score; localStorage.setItem('snakeHigh', highScore); }
    updateStatus();
    return;
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    if (score > highScore) { highScore = score; localStorage.setItem('snakeHigh', highScore); }
    updateStatus();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    eaten++;
    if (score > highScore) { highScore = score; localStorage.setItem('snakeHigh', highScore); }
    updateStatus();
    placeFood();
  } else {
    snake.pop();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'a' || e.key === 'A') aiMode = !aiMode;
  if (e.key === ' ' && !gameOver && eaten < 15) paused = !paused;
  if (e.key === 'r' || e.key === 'R') init();
  if (!aiMode) {
    if (e.key === 'ArrowUp' && dir.y === 0) dir = {x: 0, y: -1};
    if (e.key === 'ArrowDown' && dir.y === 0) dir = {x: 0, y: 1};
    if (e.key === 'ArrowLeft' && dir.x === 0) dir = {x: -1, y: 0};
    if (e.key === 'ArrowRight' && dir.x === 0) dir = {x: 1, y: 0};
  }
});

init();
setInterval(() => { step(); draw(); }, 80);
</script>
</body>
</html>
